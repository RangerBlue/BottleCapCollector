########################################################################################################################
# GCP Production Profile
# This profile is used when deploying to Cloud Run
# Application Default Credentials (ADC) are used - no credential files needed
########################################################################################################################

########################################################################################################################
# GCP Project Configuration
########################################################################################################################
bcc.firestore-project-id=${GCP_PROJECT_ID:bottlecapcollector-480817}
bcc.cloud-storage-project-id=${GCP_PROJECT_ID:bottlecapcollector-480817}
bcc.vision-api-project-id=${GCP_PROJECT_ID:bottlecapcollector-480817}
bcc.vertex-ai-project-id=${GCP_PROJECT_ID:bottlecapcollector-480817}

########################################################################################################################
# Firestore configuration - Production (no emulator)
########################################################################################################################
# Empty emulator host means use real Firestore
bcc.firestore-emulator-host=
# Optional: specify database ID if not using default
bcc.firestore-database-id=${FIRESTORE_DATABASE_ID:}
# No credentials path - use Application Default Credentials
bcc.firestore-credentials-path=

########################################################################################################################
# Cloud Storage configuration - Production
########################################################################################################################
bcc.cloud-storage-bucket-name=${CLOUD_STORAGE_BUCKET:bottlecap-images}
# No credentials path - use Application Default Credentials
bcc.cloud-storage-credentials-path=

########################################################################################################################
# Vision API configuration - Production
########################################################################################################################
# No credentials path - use Application Default Credentials
bcc.vision-api-credentials-path=

########################################################################################################################
# Vertex AI configuration - Production
########################################################################################################################
bcc.vertex-ai-location=${VERTEX_AI_LOCATION:us-central1}
bcc.vertex-ai-embedding-model-id=multimodalembedding@001
# No credentials path - use Application Default Credentials
bcc.vertex-ai-credentials-path=

########################################################################################################################
# CORS configuration - Production
########################################################################################################################
bcc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

########################################################################################################################
# OAuth2 configuration - Production
# These should be set via environment variables or Secret Manager
########################################################################################################################
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

########################################################################################################################
# Legacy API configuration
########################################################################################################################
bcc.legacy-user-id=101476981906559185468
bcc.legacy-collection-key=e95fbd6a-0b76-4cbc-8329-d23cdc540e40/BM5z89tzBBeLwW9iRve0
bcc.legacy-collection-name=caps

########################################################################################################################
# Logging - Cloud Run uses stdout/stderr
########################################################################################################################
logging.level.root=INFO
logging.level.com.km.bottlecapcollector=INFO
