########################################################################################################################
# Application properties
########################################################################################################################
bcc.google-drive-client-id=
bcc.google-drive-client-secret=
bcc.google-drive-project-id=
bcc.google-drive-folder-id=
bcc.google-drive-token-path = ./config/tokens
bcc.google-drive-update-cron = 0 0 * * * ?
bcc.file-upload-dir=F:/bc/pictures
bcc.validation-response-item-size = 9
bcc.similarity-search-range = 0.1
bcc.similarity-search-response-size = 50
# CORS allowed origins (comma-separated for multiple)
bcc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

########################################################################################################################
# Multipart files configuration
########################################################################################################################
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

########################################################################################################################
# Logging configuration
# Note: logback-spring.xml is auto-detected. Use spring.profiles.active=gcp for JSON logging in Cloud Run
########################################################################################################################
# logging.file.path and logging.file.name removed - Cloud Run uses stdout only

########################################################################################################################
# Query logging configuration for debugging
########################################################################################################################
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type=TRACE

########################################################################################################################
# Actuator configuration
########################################################################################################################
management.endpoints.enabled-by-default=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/management
#management.server.port=8081
management.endpoint.health.show-details=always


########################################################################################################################
# Info configuration
########################################################################################################################
info.app.name=BottleCapCollector
info.app.description=Application for collecting caps
info.app.version=0.0.1
info.learning.for = Spring Boot Certification


#########################################################################################################################
## Liquibase configuration
#########################################################################################################################
#spring.liquibase.enabled = true
#spring.liquibase.change-log = classpath:/db/changelog/changelog-gcp.xml
#logging.level.liquibase=DEBUG
#logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG


########################################################################################################################
# Server configuration for Cloud Run
########################################################################################################################
# Cloud Run provides PORT environment variable
server.port=${PORT:8080}

# Trust proxy headers from Cloud Run load balancer (required for correct OAuth2 redirect URIs)
server.forward-headers-strategy=framework

########################################################################################################################
# Session configuration - Cookie-based for stateless Cloud Run
########################################################################################################################
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=1h

########################################################################################################################
# Google OAuth2 configuration
########################################################################################################################
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=openid,profile,email

########################################################################################################################
# Firestore configuration
########################################################################################################################
# For local development with Firestore emulator
bcc.firestore-emulator-host=127.0.0.1:8081
bcc.firestore-project-id=demo-no-project

# Disable Spring Cloud GCP Firestore auto-configuration (using custom FirestoreConfiguration)
spring.cloud.gcp.firestore.enabled=false

########################################################################################################################
# Cloud Storage configuration
########################################################################################################################
bcc.cloud-storage-bucket-name=
bcc.cloud-storage-project-id=
bcc.cloud-storage-credentials-path=./config/gcs-credentials.json

########################################################################################################################
# Vision API configuration
########################################################################################################################
bcc.vision-api-project-id=
bcc.vision-api-credentials-path=./config/vision-credentials.json

########################################################################################################################
# Vertex AI configuration (for embeddings)
########################################################################################################################
bcc.vertex-ai-project-id=
bcc.vertex-ai-location=
bcc.vertex-ai-embedding-model-id=
bcc.vertex-ai-credentials-path=./config/vertex-credentials.json
